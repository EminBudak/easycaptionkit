name: test

on:
  push:
  pull_request:

jobs:
  test:
    # Ubuntu 22.04's ffmpeg is 4.4, the oldest easycaptionkit works with and
    # the one the hosted service runs; ubuntu-latest has a newer one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs;
      # 22.04 has no such setting.
      - name: Let Chrome start
        run: if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      # Google Chrome comes with the runner; ffmpeg does not.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && ffmpeg -version | head -1
      - run: npm test
